# Publishes the web GUI (WebGUI/) and the generator it runs ("Single Generator/") to GitHub Pages.
# Visitors' browsers fetch the generator's .py files from here, so a new release updates the tool on the blog.
name: Web GUI On GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the generator is in the repository
        run: |
          for f in "Single Generator/Generator/__init__.py" "Single Generator/Generator/Run/CheckParameters.py" \
                   "Single Generator/Generator/Stator/StatorAssembly.py" "Single Generator/Generator/Rotor/RotorBuilder.py" \
                   "Single Generator/Parameters/Board_Parameters.py" "Single Generator/Parameters/RX_Parameters.py" \
                   "Single Generator/Parameters/TX_Parameters.py" "Single Generator/Parameters/Rotor_Parameters.py" \
                   "Single Generator/Parameters/Parameters.py" WebGUI/WebGenerator.py WebGUI/index.html; do
            test -f "$f" || { echo "::error::$f is missing (push the generator first)"; exit 1; }
          done

      - name: Collect the site
        run: |
          mkdir -p _site
          mkdir -p "_site/Single Generator"
          cp -r "Single Generator/Generator" "Single Generator/Parameters" "_site/Single Generator/"
          cp -r WebGUI _site/
          find _site -name __pycache__ -type d -prune -exec rm -rf {} +
          rm -f _site/WebGUI/BloggerPage.html
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=WebGUI/"><a href="WebGUI/">Coil Generator</a>\n' > _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
